# Reverse proxy rules for faucet.eltx.online
ProxyPassReverse / http://127.0.0.1:18080/

RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}e"

<IfModule mod_headers.c>
    Header always set Access-Control-Allow-Origin "https://eltx.online"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Content-Security-Policy "default-src 'self'; connect-src 'self' https://rpc.eltx.online; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline';"
</IfModule>

<IfModule mod_security2.c>
    SecRuleEngine On
    SecRequestBodyAccess On
    SecAction "id:900001,phase:1,pass,nolog,ctl:ruleEngine=DetectionOnly"
</IfModule>

<Location /drip>
    LimitRequestBody 1048576
    <IfModule mod_ratelimit.c>
        SetOutputFilter RATE_LIMIT
        SetEnv rate-limit 256
    </IfModule>
</Location>
