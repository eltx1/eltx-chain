# Reverse proxy rules for explorer.eltx.online
ProxyPassReverse / http://127.0.0.1:14000/

<IfModule mod_headers.c>
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data: https://explorer.eltx.online; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://rpc.eltx.online wss://rpc.eltx.online;"
</IfModule>

<Location /graphql>
    ProxyPassReverse http://127.0.0.1:14000/graphql
    LimitRequestFieldSize 16384
</Location>
