# Reverse proxy rules for rpc.eltx.online
ProxyPassReverse / http://127.0.0.1:18545/

RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}e"

<Location />
    Header always set Access-Control-Allow-Origin "https://eltx.online"
    Header always set Access-Control-Allow-Methods "GET, POST, OPTIONS"
    Header always set Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With"
    Header always set Access-Control-Allow-Credentials "true"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"

    SetEnvIf X-Forwarded-For "^$" real_ip=%{REMOTE_ADDR}
    SetEnvIf X-Forwarded-For "(.+)" real_ip=$1

    # Basic rate limiting per IP
    SetEnvIfNoCase X-Forwarded-For "^(.+)$" client_ip=$1
    <IfModule mod_ratelimit.c>
        SetOutputFilter RATE_LIMIT
        SetEnv rate-limit 500
    </IfModule>

    # Require Cloudflare ASN 13335 or internal IPs
    Require ip 127.0.0.1/32
    Require ip 10.0.0.0/8
    Require ip 172.16.0.0/12
    Require ip 192.168.0.0/16
    Require ip 103.21.244.0/22
    Require ip 103.22.200.0/22
    Require ip 103.31.4.0/22
    Require ip 104.16.0.0/13
    Require ip 104.24.0.0/14
    Require ip 108.162.192.0/18
    Require ip 131.0.72.0/22
    Require ip 141.101.64.0/18
    Require ip 162.158.0.0/15
    Require ip 172.64.0.0/13
    Require ip 173.245.48.0/20
    Require ip 188.114.96.0/20
    Require ip 190.93.240.0/20
    Require ip 197.234.240.0/22
    Require ip 198.41.128.0/17
</Location>

<LocationMatch "^/(login|admin)">
    Deny from all
</LocationMatch>

# Allow preflight requests
RewriteEngine On
RewriteCond %{REQUEST_METHOD} OPTIONS
RewriteRule ^(.*)$ $1 [R=200,L]
